name: EP News publication state engine
on:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ["EP News publishing gate", "EP News article smoke test", "Article publishing integrity", "Generate article share metadata index", "EP News one-pass article preflight", "EP News YouTube encoding", "EP News browser publication verification"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: publication-state-${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.run_id || 'reconcile' }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/publication-state*.test.mjs scripts/publication-alerts.test.mjs
  reconcile:
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    if: github.event_name != 'pull_request' || github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore previous successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-state
          id=$(gh api "repos/${{ github.repository }}/actions/workflows/publication-state-engine.yml/runs?status=completed&per_page=50" --jq '.workflow_runs[] | .id' | while read -r run; do
            if [ "$run" != "${{ github.run_id }}" ] && gh run download "$run" -n publication-state -D previous-state 2>/dev/null; then echo "$run"; break; fi
          done)
          echo "Previous snapshot run: ${id:-none}"
      - name: Capture authoritative PR states
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: node scripts/capture-publication-state.mjs
      - name: Summarize actionable transitions
        if: always()
        run: |
          node -e 'const r=require("./publication-state.json"); console.log("## Publication state transitions"); for(const p of r.transitions||[]) console.log(`- #${p.number}: ${p.status} / ${p.deployment?.status||"UNVERIFIED"}`); for(const e of r.errors||[]) console.log(`- Limitation: ${e}`)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-state
          path: publication-state.json
          retention-days: 30
  notify:
    needs: reconcile
    if: github.event_name != 'pull_request' && github.repository == 'epnews/epnews-website'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: publication-state
      - name: Notify on verified actionable failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/send-publication-alerts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-alert-delivery
          path: publication-alert-delivery.json
          retention-days: 30
