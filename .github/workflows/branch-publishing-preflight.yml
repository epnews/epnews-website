name: EP News branch publishing preflight
on:
  push:
    branches: ['feature/**']
    paths: ['content/**','index.html','assets/images/**','editorial-evidence/**','.github/workflows/branch-publishing-preflight.yml','scripts/validate-editorial-evidence.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epnews-branch-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Wait for complete package and image import
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            git fetch origin main "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            git diff --name-only origin/main...HEAD | grep -E '^content/[a-z0-9-]+\.js$' | grep -v -E '^content/(editorial|stories)\.js$' > /tmp/articles || true
            ready=1
            while IFS= read -r article; do
              node scripts/validate-editorial-evidence.mjs "$article" || ready=0
              grep -Fq "$article" index.html || ready=0
            done < /tmp/articles
            if [ "$ready" = 1 ]; then break; fi
            if [ "$attempt" = 12 ]; then echo 'Package incomplete or evidence/image verification failed'; exit 1; fi
            sleep 15
          done
      - name: Execute generators and validators
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-sitemap.mjs
          node scripts/build-share-index.mjs
          while IFS= read -r article; do
            node --check "$article"
            node scripts/preflight-article.mjs "$article"
          done < /tmp/articles
          node scripts/generate-sitemap.mjs --check
          node scripts/validate-publishing.mjs
          node scripts/validate-all-articles.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml content/share-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generate validated publishing metadata'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "Validated branch head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
