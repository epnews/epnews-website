name: Secure Canva image import
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Image filename slug
        required: true
        type: string
      expected_sha256:
        description: Approved SHA-256 (blank stages preview only)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: epnews-canva-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'epnews/epnews-website' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0
      - name: Retrieve and verify exact PNG
        env:
          EP_CANVA_EXPORT_URL: ${{ secrets.EP_CANVA_EXPORT_URL }}
          IMAGE_SLUG: ${{ inputs.slug }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: python scripts/import_canva_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-canva-preview
          path: external-image-staging/
          retention-days: 1
      - name: Commit approved image only
        if: inputs.expected_sha256 != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images content/image-imports.json
          if ! git diff --cached --quiet; then
            git commit -m "Import approved exact-byte Canva graphic"
            git push
          fi
