name: Analytics authentication test
on:
  push:
    branches: ['test/analytics-auth-20261112']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private analytics response schema
        env:
          ANALYTICS_TOKEN: ${{ secrets.EP_NEWS_ANALYTICS_KEY }}
        run: |
          set +x
          test -n "$ANALYTICS_TOKEN"
          trap 'rm -f "$RUNNER_TEMP/ep-analytics.json"' EXIT
          curl --silent --show-error --fail --max-time 30 -H "X-Analytics-Token: $ANALYTICS_TOKEN" https://epnews.pages.dev/api/analytics -o "$RUNNER_TEMP/ep-analytics.json"
          jq -e '(.totalVisits|type=="number") and (.totalClicks|type=="number") and (.byPlacement|type=="object") and ([.daily,.articleReads,.referralSources,.hourlyReads,.articleDaily]|all(type=="array"))' "$RUNNER_TEMP/ep-analytics.json" >/dev/null
          echo 'Authenticated analytics response schema verified; no metrics or credentials printed.'
