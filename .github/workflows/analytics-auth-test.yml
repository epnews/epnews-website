name: Analytics authentication test
on:
  push:
    branches: ['test/analytics-auth-20261112']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check authentication
        env:
          ANALYTICS_TOKEN: ${{ secrets.EP_NEWS_ANALYTICS_KEY }}
        run: |
          set +x
          if [ -z "$ANALYTICS_TOKEN" ]; then echo 'Analytics secret missing'; exit 1; fi
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' -H "X-Analytics-Token: $ANALYTICS_TOKEN" https://epnews.pages.dev/api/analytics)
          echo "Analytics HTTP status: $status"
          test "$status" = 200

