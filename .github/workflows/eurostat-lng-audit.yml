name: Eurostat EU27 LNG source audit
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline extractor tests
        run: python -m unittest discover -s scripts -p 'test_eurostat_eu27_lng.py'
      - name: Fetch official Eurostat monthly LNG origin records
        run: python scripts/extract_eurostat_eu27_lng.py --output europe-eurostat-eu27-lng-observations.json
      - name: Preserve source observations for review
        uses: actions/upload-artifact@v4
        with:
          name: eurostat-eu27-lng-observations
          path: europe-eurostat-eu27-lng-observations.json
          retention-days: 30
