name: EIA H1 Onsystem Sales Reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_eia_h1_onsystem_sales.py'
      - 'scripts/test_build_eia_h1_onsystem_sales.py'
      - '.github/workflows/eia-h1-onsystem-sales.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'xlrd>=2.0,<3'
      - run: python -m unittest scripts.test_build_eia_h1_onsystem_sales
      - run: python scripts/build_eia_h1_onsystem_sales.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia-h1-onsystem-sales-audit
          path: eia-h1-onsystem-sales-audit.json
          if-no-files-found: ignore
