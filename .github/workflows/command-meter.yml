name: EP News command meter
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'chaos-*.js'
      - 'chaos-dashboard.css'
      - 'index.html'
      - 'scripts/test_chaos_meter.cjs'
      - 'scripts/validate_soi_diplomacy.cjs'
      - 'data/soi-diplomatic-audit-worklist.json'
      - 'soi-diplomatic-outcomes-model.js'
      - 'scripts/smoke_chaos_meter.cjs'
      - '.github/workflows/command-meter.yml'
      - 'scripts/audit_soi_*.cjs'
      - 'scripts/test_soi_*.cjs'
      - 'data/soi-*.json'
      - 'docs/soi-*.md'
permissions:
  contents: read
jobs:
  command-meter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check chaos-dashboard.js && node --check chaos-meter-data.js && node --check chaos-meter-model.js && node --check chaos-completion-model.js && node --check scripts/smoke_chaos_meter.cjs && node --check scripts/test_chaos_meter.cjs && node --check scripts/validate_soi_diplomacy.cjs
      - run: node scripts/validate_soi_diplomacy.cjs
      - run: node scripts/test_chaos_meter.cjs
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium

      - name: Browser smoke tests (desktop and mobile)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/epnews-meter-server.log 2>&1 &
          node scripts/smoke_chaos_meter.cjs
      - name: Live production regression (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EPNEWS_TEST_URL: https://epnews.pages.dev/
        run: node scripts/smoke_chaos_meter.cjs
