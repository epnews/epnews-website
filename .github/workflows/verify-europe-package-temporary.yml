name: Verify Europe package bytes
on:
  push:
    branches: ['feature/europe-russian-energy-sanctions-20261116']
    paths: ['.github/workflows/verify-europe-package-temporary.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - run: |
          sha256sum content/europe-russian-energy-sanctions-20261116.js assets/images/epnews_europe_russian_energy_1600x900.png
          python -c "from PIL import Image; im=Image.open('assets/images/epnews_europe_russian_energy_1600x900.png'); im.load(); print(im.format, im.size); assert im.size==(1600,900)"
