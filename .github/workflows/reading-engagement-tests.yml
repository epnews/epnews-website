name: Reading engagement tests
on:
  pull_request:
  push:
    branches: [reading-engagement-opt-in]
permissions:
  contents: read
jobs:
  reading-engagement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/test-reading-engagement.mjs
