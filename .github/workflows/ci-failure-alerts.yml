name: EP News CI failure alerts
on:
  workflow_run:
    workflows:
      - EP News command meter
      - EP News publishing gate
      - EP News article smoke test
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  report-failure:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Collect failure diagnostics and notify via GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request
          repo=os.environ['GH_REPO']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          event=json.load(open(os.environ['EVENT_PATH']))
          run=event.get('workflow_run')
          if not run:
              print('Manual dispatch: no failed run supplied; no issue created.')
              raise SystemExit(0)
          if run.get('conclusion') not in ('failure','timed_out','cancelled'):
              raise SystemExit(0)
          run_id=run['id']
          jobs=api(f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          failures=[]
          for job in jobs:
              if job.get('conclusion') not in ('failure','timed_out','cancelled'):
                  continue
              steps=[s for s in job.get('steps',[]) if s.get('conclusion') in ('failure','timed_out','cancelled')]
              failures.append((job,steps))
          title=f"[CI failure] {run['name']} — run {run_id}"
          lines=[
              'Automated diagnostic report. This issue also serves as the GitHub notification.',
              '',
              f"- Workflow: **{run['name']}**",
              f"- Conclusion: **{run['conclusion']}**",
              f"- Run: {run['html_url']}",
              f"- Commit: \`{run['head_sha']}\`",
              f"- Branch: \`{run['head_branch']}\`",
              f"- Trigger: \`{run['event']}\`",
              '',
              '### Failed jobs and steps'
          ]
          if not failures: lines.append('No failed job returned by GitHub; inspect the workflow run directly.')
          for job,steps in failures[:15]:
              lines.extend(['',f"**{job['name']}** — {job['conclusion']}",f"Job: {job['html_url']}"])
              for s in steps[:15]: lines.append(f"- Step {s.get('number','?')}: {s['name']} — {s['conclusion']}")
              # Only request logs for failed jobs; GitHub returns a redirect to the logs archive/text.
              # Avoid printing logs into Actions output; post a bounded sanitized excerpt instead.
              try:
                  proc=subprocess.run(['gh','api',f'repos/{repo}/actions/jobs/{job["id"]}/logs'],capture_output=True,text=True,timeout=30)
                  raw=proc.stdout if proc.returncode==0 else ''
                  candidates=[x for x in raw.splitlines() if any(t in x.lower() for t in ('error','failed','exception','syntaxerror','assertion','fatal'))]
                  excerpt='\n'.join(candidates[-12:])[:3500]
                  if excerpt:
                      import re
                      excerpt=re.sub(r'(?i)(authorization:|token[=:]|password[=:]|secret[=:])\\s*[^\\s]+',r'\\1 [REDACTED]',excerpt)
                      lines.extend(['','Relevant log lines (automated, potentially incomplete):','\`\`\`text',excerpt,'\`\`\`'])
              except Exception as e:
                  lines.append(f'Log excerpt unavailable ({type(e).__name__}); use job link.')
          lines.extend(['','### Next action','Review the failed step and logs, repair in a separate PR, then rerun all three required checks. Do not merge on failed checks.'])
          body='\n'.join(lines)[:60000]
          # Deduplicate by workflow run ID; repeated events should not create notification spam.
          existing=api(f'repos/{repo}/issues?state=all&per_page=100')
          if any(issue.get('title')==title for issue in existing):
              print(f'Issue already exists for run {run_id}')
              raise SystemExit(0)
          payload=json.dumps({'title':title,'body':body}).encode()
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues',data=payload,
              headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}',
                       'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=30) as response:
              created=json.load(response)
          print(f"Created diagnostic issue: {created['html_url']}")
          PY
