name: EIA H1 Coverage-Adjusted Gross Value Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_eia_h1_coverage_adjusted_values.py'
      - 'scripts/test_eia_h1_coverage_adjusted_values.py'
      - 'data/eia-h1-table24-monthly-coverage.json'
      - '.github/workflows/eia-h1-coverage-adjusted-values.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install xlrd pdfplumber
      - run: python -m py_compile scripts/build_eia_h1_coverage_adjusted_values.py
      - run: python -m unittest scripts.test_eia_h1_coverage_adjusted_values
      - name: Independently verify monthly Table 24 coverage against both PDFs
        run: python -m scripts.verify_eia_table24_h1_source
      - name: Run audit and preserve full traceback
        shell: bash
        run: |
          set +e
          python -m scripts.build_eia_h1_coverage_adjusted_values > eia-h1-audit-run.log 2>&1
          code=$?
          cat eia-h1-audit-run.log
          python - "$code" <<'PY'
          import json,sys
          from pathlib import Path
          code=int(sys.argv[1])
          Path('eia-h1-audit-diagnostics.json').write_text(json.dumps({
            'exitCode':code,
            'calculationArtifactExists':Path('eia-h1-coverage-adjusted-gross-values.json').exists(),
            'lastLogLines':Path('eia-h1-audit-run.log').read_text()[-12000:]
          },indent=2)+'\\n')
          PY
          exit "$code"
      - run: |
          python - <<'PY'
          import json
          d=json.load(open('eia-h1-coverage-adjusted-gross-values.json'))
          assert d['publishable']
          assert d['reviewStatus']=='SOURCE_PDF_MONTHLY_VERIFIED'
          assert d['actualConsumerExpenditureUsd'] is None
          assert d['lngCausedDomesticCostUsd'] is None
          assert d['netNationalBenefitUsd'] is None
          assert d['geopoliticalInfluenceScore'] is None
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia-h1-coverage-adjusted-audit
          path: |
            eia-h1-coverage-adjusted-gross-values.json
            eia-h1-audit-run.log
            eia-h1-audit-diagnostics.json
            eia-table24-h1-independent-verification.json
