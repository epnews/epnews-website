name: EP News YouTube encoding
on:
  pull_request:
  push:
    branches: [main]
jobs:
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil
      - run: |
          /usr/bin/python3 -c "from PIL import Image; Image.new('RGB',(1600,900),'navy').save('/tmp/fixture.png')"
          echo '{"image":"/tmp/fixture.png","hook":"Test hook","development":"Test development","impact":"Test impact","cta":"Subscribe"}' > /tmp/short.json
          /usr/bin/python3 scripts/ep_shorts.py /tmp/short.json /tmp/short.mp4
          /usr/bin/python3 scripts/validate_ep_short.py /tmp/short.mp4
          ffmpeg -v error -i /tmp/short.mp4 -c:v copy -c:a aac -ar 48000 -movflags +faststart /tmp/bad.mp4
          if /usr/bin/python3 scripts/validate_ep_short.py /tmp/bad.mp4; then exit 1; fi
