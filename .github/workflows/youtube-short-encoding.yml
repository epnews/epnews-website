name: EP News YouTube encoding
on:
  pull_request:
  push:
    branches: [main]
jobs:
  encoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision pinned prebuilt encoding binaries
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 2 --timeout 20 --only-binary=:all: Pillow==11.3.0 imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/ep-encoding/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ep-encoding/bin/ffmpeg"
          npm install --prefix "$RUNNER_TEMP/ep-encoding" --no-audit --no-fund --fetch-retries=2 --fetch-timeout=30000 ffprobe-static@3.1.0
          ln -sf "$(node -p "require('$RUNNER_TEMP/ep-encoding/node_modules/ffprobe-static').path")" "$RUNNER_TEMP/ep-encoding/bin/ffprobe"
          echo "$RUNNER_TEMP/ep-encoding/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/ep-encoding/bin:$PATH"
          ffmpeg -version
          ffprobe -version
          python -c 'from PIL import ImageFont; [ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans"+suffix+".ttf",24) for suffix in ("","-Bold")]'
      - run: |
          python -c "from PIL import Image; Image.new('RGB',(1600,900),'navy').save('/tmp/fixture.png')"
          test -s assets/images/ep-news-official-horizontal-masthead-20261105.png
          PYTHONPATH=scripts python -c "from ep_shorts import resolve_article; p,c=resolve_article('https://epnews.pages.dev/article/autonomous-weapons-20261116'); assert p.endswith('autonomous-weapons-final-1600x900.png') and c=='WORLD'"
          echo '{"image":"/tmp/fixture.png","test_fixture":true,"hook":"Test hook","development":"Test development","impact":"Test impact","cta":"Subscribe","durations":[3,5,4,3]}' > /tmp/short.json
          python scripts/ep_shorts.py /tmp/short.json /tmp/short.mp4
          python scripts/validate_ep_short.py /tmp/short.mp4 --expected-duration 15
          ffmpeg -v error -i /tmp/short.mp4 -c:v copy -c:a aac -ar 48000 -movflags +faststart /tmp/bad.mp4
          if python scripts/validate_ep_short.py /tmp/bad.mp4 --expected-duration 15; then exit 1; fi

          if python scripts/validate_ep_short.py /tmp/short.mp4 --expected-duration 24; then exit 1; fi
          for durations in '3,7,7,7' '3,10,12,10'; do
            python -c "import json; p='/tmp/short.json'; c=json.load(open(p)); c['durations']=[int(x) for x in '$durations'.split(',')]; json.dump(c,open(p,'w'))"
            total=$(python -c "print(sum(map(int,'$durations'.split(','))))")
            python scripts/ep_shorts.py /tmp/short.json /tmp/short-$total.mp4
            python scripts/validate_ep_short.py /tmp/short-$total.mp4 --expected-duration "$total"
          done
