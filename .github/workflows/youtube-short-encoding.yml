name: EP News YouTube encoding
on:
  pull_request:
  push:
    branches: [main]
jobs:
  encoding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify or install encoding dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then missing+=(ffmpeg); fi
          if ! /usr/bin/python3 -c 'from PIL import Image, ImageFont' 2>/dev/null; then missing+=(python3-pil); fi
          if ! test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || ! test -s /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then missing+=(fonts-dejavu-core); fi
          if (( ${#missing[@]} )); then
            printf 'Installing missing dependencies: %s\n' "${missing[*]}"
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y "${missing[@]}"
          else
            echo 'All encoding dependencies already installed; skipping apt.'
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          /usr/bin/python3 -c 'from PIL import Image, ImageFont; ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 24)'

      - run: |
          /usr/bin/python3 -c "from PIL import Image; Image.new('RGB',(1600,900),'navy').save('/tmp/fixture.png')"
          test -s assets/images/ep-news-official-horizontal-masthead-20261105.png
          PYTHONPATH=scripts /usr/bin/python3 -c "from ep_shorts import resolve_article; p,c=resolve_article('https://epnews.pages.dev/article/autonomous-weapons-20261116'); assert p.endswith('autonomous-weapons-final-1600x900.png') and c=='WORLD'"
          echo '{"image":"/tmp/fixture.png","test_fixture":true,"hook":"Test hook","development":"Test development","impact":"Test impact","cta":"Subscribe","durations":[3,5,4,3]}' > /tmp/short.json
          /usr/bin/python3 scripts/ep_shorts.py /tmp/short.json /tmp/short.mp4
          /usr/bin/python3 scripts/validate_ep_short.py /tmp/short.mp4 --expected-duration 15
          ffmpeg -v error -i /tmp/short.mp4 -c:v copy -c:a aac -ar 48000 -movflags +faststart /tmp/bad.mp4
          if /usr/bin/python3 scripts/validate_ep_short.py /tmp/bad.mp4 --expected-duration 15; then exit 1; fi

          if /usr/bin/python3 scripts/validate_ep_short.py /tmp/short.mp4 --expected-duration 24; then exit 1; fi
          for durations in '3,7,7,7' '3,10,12,10'; do
            /usr/bin/python3 -c "import json; p='/tmp/short.json'; c=json.load(open(p)); c['durations']=[int(x) for x in '$durations'.split(',')]; json.dump(c,open(p,'w'))"
            total=$(/usr/bin/python3 -c "print(sum(map(int,'$durations'.split(','))))")
            /usr/bin/python3 scripts/ep_shorts.py /tmp/short.json /tmp/short-$total.mp4
            /usr/bin/python3 scripts/validate_ep_short.py /tmp/short-$total.mp4 --expected-duration "$total"
          done
