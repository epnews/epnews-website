name: Gate Gaspeil public October snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_gate_gaspeil_snapshot_20261102.py'
      - 'scripts/reconcile_gate_alsi_gaspeil_20261102.py'
      - '.github/workflows/gate-gaspeil-october-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression
        run: |
          python scripts/test_gate_gaspeil_snapshot_20261102.py
          python scripts/test_reconcile_gate_alsi_gaspeil_20261102.py
      - name: Fetch October public API snapshot and exception summary
        run: python scripts/fetch_gate_gaspeil_snapshot_20261102.py
      - name: Upload dated raw snapshot and audit
        uses: actions/upload-artifact@v4
        with:
          name: gate-gaspeil-october-2026-snapshot
          path: |
            gate-gaspeil-october-2026-snapshot.json
            gate-gaspeil-october-2026-summary.json
          retention-days: 30
          if-no-files-found: error
