name: EP News article smoke test
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  article-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_article_registry.cjs
