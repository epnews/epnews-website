name: Build corrected Egypt Saudi cover
on:
  push:
    branches: ["feature/egypt-saudi-corrected-cover"]
    paths:
      - "scripts/build_egypt_saudi_cover.py"
      - ".github/workflows/egypt-saudi-cover.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0 requests==2.32.5
      - run: python scripts/build_egypt_saudi_cover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/egypt-saudi-approved-photo.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add accurate Egyptian Parliament feature cover"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
