name: Refresh published article sitemap
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'content/**'
      - 'scripts/generate-sitemap.mjs'
      - 'sitemap.xml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate sitemap from published stories
        run: node scripts/generate-sitemap.mjs
      - name: Commit sitemap when changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: refresh published article sitemap"
            git push
          fi
