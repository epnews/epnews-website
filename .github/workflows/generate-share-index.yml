name: Generate article share metadata index
on:
  push:
    branches: [main]
    paths:
      - 'content/**.js'
      - 'scripts/build-share-index.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate share index
        run: node scripts/build-share-index.mjs
      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/share-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh article share metadata index [skip ci]"
            git push
          fi
