name: Generate article share metadata index
on:
  push:
    branches: [main]
    paths:
      - 'content/**.js'
      - 'scripts/build-share-index.mjs'
      - '.github/workflows/generate-share-index.yml'
  pull_request:
    paths:
      - 'content/**.js'
      - 'scripts/build-share-index.mjs'
      - 'functions/share/**'
      - '.github/workflows/generate-share-index.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate share index
        run: node scripts/build-share-index.mjs
      - name: Validate metadata coverage
        run: |
          node -e "const x=require('./content/share-index.json'); for(const id of ['power','japan-philippines-radar-drones-20261109','big-bend-border-construction-20261109']) if(!x[id]?.title) process.exit(1); console.log(Object.keys(x).length,'indexed articles')"
      - name: Propose share index update through a PR (protected main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: refresh article share metadata index'
          branch: automation/refresh-share-index
          delete-branch: true
          title: 'chore: refresh article share metadata index'
          body: |
            Automatically generated share metadata for published articles.
            Review and merge only after required status checks pass.
          add-paths: content/share-index.json
