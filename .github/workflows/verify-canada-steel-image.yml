name: Verify Canada steel hero
on:
  push:
    branches: [feature/canada-china-steel-tariffs-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p=Path('assets/images/epnews_canada_china_steel_1600x900.png')
          b=p.read_bytes()
          im=Image.open(p)
          im.load()
          print(im.format, im.size, len(b), hashlib.sha256(b).hexdigest())
          assert im.format=='PNG' and im.size==(1600,900) and len(b)<8000000
          assert hashlib.sha256(b).hexdigest()=='515f9b877b4bfabc98e98b15882e6dc6c4c125059a471b359292cde03e04db9c', 'Imported bytes differ from approved original'
          PY
