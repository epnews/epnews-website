name: Build verified EP News photo banners
on:
  push:
    branches: ["feature/real-photo-magazine-banners"]
    paths:
      - ".github/workflows/build-photo-banners.yml"
      - "scripts/build_photo_banners.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0 requests==2.32.5
      - run: python scripts/build_photo_banners.py
      - name: Commit generated photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*-photo.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Generate real-photo EP News magazine banners"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
