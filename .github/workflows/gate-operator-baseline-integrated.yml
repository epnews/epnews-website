name: Gate October operator baseline and integrated evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-operator-baseline-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source acquisition and integrated audit
        run: |
          python scripts/test_europe_lng_gate_alsi_20261102.py
          python scripts/test_gate_gaspeil_snapshot_20261102.py
          python scripts/test_gate_integrated_evidence_audit_20261102.py
          python scripts/test_audit_gate_inventory_deltas_20261102.py
          python scripts/test_audit_gate_gaspeil_indicative_value_20261102.py
          python scripts/test_audit_gate_arrival_collision_exposure_20261102.py
          python scripts/test_audit_gate_origin_evidence_basis_20261102.py
          python scripts/test_audit_gate_gasday_utc_offsets_20261102.py
          python scripts/test_audit_gate_estimate_stock_variance_20261102.py
          python scripts/test_audit_gate_proxy_variance_cancellation_20261102.py
          python scripts/test_run_gate_snapshot_evidence_diagnostics_20261102.py
          python scripts/test_audit_gate_ttf_proxy_value_sensitivity_20261102.py
          python scripts/test_audit_gate_unmeasured_exposure_20261102.py
          python scripts/test_audit_gate_gasday_attribution_concentration_20261102.py
          python scripts/test_audit_gate_gasday_offset_hour_patterns_20261102.py
          python scripts/test_check_gate_cross_diagnostic_consistency_20261102.py
          python scripts/test_audit_gate_measured_operator_quality_segments_20261102.py
          python scripts/test_audit_gate_vessel_claim_evidence_gates_20261102.py
          python scripts/test_audit_gate_source_independence_20261102.py
          python scripts/test_audit_gate_attribution_stock_delta_eligibility_20261102.py
      - name: Verify GIE key
        env:
          GIE_ALSI_API_KEY: ${{ secrets.GIE_ALSI_API_KEY }}
        run: |
          if [ -z "$GIE_ALSI_API_KEY" ]; then
            echo "::error::GIE_ALSI_API_KEY is required for authenticated Gate operator observations"
            exit 1
          fi
      - name: Fetch Gate operator September 30 to October 31
        env:
          GIE_ALSI_API_KEY: ${{ secrets.GIE_ALSI_API_KEY }}
        run: |
          python scripts/fetch_europe_lng_gate_alsi_20261102.py \
            --from-date 2026-09-30 --to-date 2026-10-31 \
            --output gate-alsi-operator-october-2026.json
      - name: Fetch Gaspeil October arrival snapshot
        run: |
          python scripts/fetch_gate_gaspeil_snapshot_20261102.py \
            --output gate-gaspeil-october-2026-snapshot.json \
            --summary gate-gaspeil-october-2026-summary.json
      - name: Produce operator delta and integrated quality reports
        run: |
          python scripts/audit_gate_inventory_deltas_20261102.py \
            --operator gate-alsi-operator-october-2026.json
          python scripts/gate_integrated_evidence_audit_20261102.py \
            --operator gate-alsi-operator-october-2026.json \
            --gaspeil gate-gaspeil-october-2026-snapshot.json
          python scripts/reconcile_gate_alsi_gaspeil_20261102.py \
            --alsi gate-alsi-operator-october-2026.json \
            --gaspeil gate-gaspeil-october-2026-snapshot.json
      - name: Produce ten cross-checked research diagnostics from archived Gaspeil snapshot
        run: |
          python scripts/run_gate_snapshot_evidence_diagnostics_20261102.py \
            --snapshot gate-gaspeil-october-2026-snapshot.json \
            --output gate-october-crosschecked-evidence-diagnostics.json
      - name: Enforce cross-diagnostic consistency gates
        run: |
          python scripts/check_gate_cross_diagnostic_consistency_20261102.py \
            --report gate-october-crosschecked-evidence-diagnostics.json \
            --output gate-october-cross-diagnostic-consistency.json
      - name: Segment attributed vessels by authenticated operator-day quality
        run: |
          python scripts/audit_gate_measured_operator_quality_segments_20261102.py --operator gate-alsi-operator-october-2026.json --snapshot gate-gaspeil-october-2026-snapshot.json --output gate-october-operator-quality-segments.json
      - name: Apply vessel-level claim evidence restrictions
        run: |
          python scripts/audit_gate_vessel_claim_evidence_gates_20261102.py --operator gate-alsi-operator-october-2026.json --snapshot gate-gaspeil-october-2026-snapshot.json --output gate-october-vessel-claim-evidence-gates.json
      - name: Audit independent evidence source lineage
        run: |
          python scripts/audit_gate_source_independence_20261102.py --operator gate-alsi-operator-october-2026.json --snapshot gate-gaspeil-october-2026-snapshot.json --output gate-october-source-independence.json
      - name: Archive source snapshots and reconciliations
        uses: actions/upload-artifact@v4
        with:
          name: gate-october-integrated-operator-vessel-research
          path: |
            gate-alsi-operator-october-2026.json
            gate-gaspeil-october-2026-snapshot.json
            gate-gaspeil-october-2026-summary.json
            gate-october-inventory-delta-audit.json
            gate-october-integrated-evidence-audit.json
            gate-october-alsi-gaspeil-reconciliation.json
            gate-october-crosschecked-evidence-diagnostics.json
            gate-october-cross-diagnostic-consistency.json
            gate-october-operator-quality-segments.json
            gate-october-vessel-claim-evidence-gates.json
            gate-october-source-independence.json
          retention-days: 14
          if-no-files-found: error
