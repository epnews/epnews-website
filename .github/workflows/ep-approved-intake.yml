name: EP News approved package intake
on:
  push:
    branches: ['feature/**']
    paths: ['publication-intake/*.json']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: epnews-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gdown==5.2.0 pillow==11.3.0
      - name: Stage and validate complete package
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t inputs < <(git diff --name-only --diff-filter=A origin/main...HEAD -- publication-intake/ | grep -E '^publication-intake/[a-z0-9-]+\.json$')
          [[ ${#inputs[@]} == 1 ]]
          node scripts/stage-approved-package.mjs "${inputs[0]}"
          sleep 15
          python scripts/import_images.py
          node scripts/generate-sitemap.mjs
          node scripts/build-share-index.mjs
          slug=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).slug' "${inputs[0]}")
          node --check "content/$slug.js"
          node scripts/validate-editorial-evidence.mjs "content/$slug.js"
          node scripts/preflight-article.mjs "content/$slug.js"
          node scripts/validate-publishing.mjs
          node scripts/validate-all-articles.mjs
          node scripts/generate-sitemap.mjs --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html content assets/images editorial-evidence editorial-reel-inputs sitemap.xml
          git rm "${inputs[0]}"
          git commit -m "Finalize approved package $slug"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          candidate=$(git rev-parse HEAD)
          echo "Validated candidate $candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - name: Open one validated publication PR
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.finalize.outputs.slug }}
          CANDIDATE: ${{ steps.finalize.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == feature/* ]]
          [[ "$SLUG" =~ ^[a-z0-9-]{1,120}$ ]]
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          remote=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          [[ "$remote" == "$CANDIDATE" ]]
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "Existing PR: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --title "Publish: $SLUG" --body "Approved editorial package. Intake preflight passed at $CANDIDATE. Requires independent CI, preview review and explicit publisher merge approval." --draft)
          echo "Publication PR: $url" >> "$GITHUB_STEP_SUMMARY"
