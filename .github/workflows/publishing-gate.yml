name: EP News publishing gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-article-assets:
    name: validate-article-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Verify imported website graphics
        run: python scripts/validate_publishing.py
