name: Import EP News images
on:
  push:
    branches: ["feature/**"]
    paths: ["content/image-imports.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epnews-image-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-images:
    if: github.repository == 'epnews/epnews-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive image downloader
        run: python -m pip install gdown==5.2.0 pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import, generate, validate and commit one consistent package
        shell: bash
        run: bash scripts/finalize-image-import.sh
