name: Import EP News images
on:
  push:
    branches: ["feature/**"]
    paths: ["content/image-imports.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    if: github.repository == 'epnews/epnews-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive image downloader
        run: python -m pip install gdown==5.2.0
      - name: Download and validate images
        run: python scripts/import_images.py
      - name: Commit imported assets to review branch
        run: |
          if git diff --quiet -- assets/images && [ -z "$(git ls-files --others --exclude-standard assets/images)" ]; then
            echo "No new assets"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          git commit -m "Import verified EP News image assets"
          git push
