name: Import EP News images
on:
  push:
    branches: ["feature/**"]
    paths: ["content/image-imports.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    if: github.repository == 'epnews/epnews-website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive image downloader
        run: python -m pip install gdown==5.2.0 pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow Google Drive public download to propagate
        run: sleep 15
      - name: Download and validate images
        run: python scripts/import_images.py
      - name: Finalize sitemap and Facebook share metadata
        run: |
          node scripts/generate-sitemap.mjs
          node scripts/build-share-index.mjs
      - name: Validate completed article package
        run: |
          node scripts/validate-publishing.mjs
          node scripts/validate-all-articles.mjs
          node scripts/generate-sitemap.mjs --check
          node - <<'NODE'
          const fs=require('fs');
          const entries=JSON.parse(fs.readFileSync('content/image-imports.json','utf8'));
          const index=fs.readFileSync('index.html','utf8');
          for(const entry of entries){
            const slug=entry.path.split('/').pop().replace(/\\.(png|jpe?g|webp)$/i,'');
            const article='content/'+slug+'.js';
            if(fs.existsSync(article)&&index.includes(article)){
              const {execFileSync}=require('child_process');
              execFileSync('node',['scripts/preflight-article.mjs',article],{stdio:'inherit'});
            }
          }
          NODE
      - name: Commit verified image and generated metadata to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images sitemap.xml content/share-index.json
          if git diff --cached --quiet; then
            echo "No image or metadata changes"
            exit 0
          fi
          git commit -m "Finalize EP News article assets and metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
