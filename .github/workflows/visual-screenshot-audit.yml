name: EP News visual screenshot audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile layout
        run: |
          sed -i 's/senate-energy-permitting-20261110/china-trade-baldwin-20261117/g' scripts/capture-visual-layout.mjs
          node scripts/capture-visual-layout.mjs
      - name: Save screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epnews-visual-audit
          path: visual-audit/
          retention-days: 7
