name: EP News Reel Generator
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive file ID or share link for approved EP News graphic'
        required: true
        type: string
      duration:
        description: 'Reel length in seconds, or auto'
        required: true
        default: '15'
        type: choice
        options:
          - '10'
          - '15'
          - '30'
          - '60'
          - 'auto'
          - 'custom'
      custom_seconds:
        description: 'Only used when duration is custom (3-90 seconds)'
        required: false
        default: '30'
        type: string
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install Drive downloader
        run: python3 -m pip install --disable-pip-version-check gdown==5.2.0
      - name: Validate inputs and download approved artwork
        env:
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          DURATION: ${{ inputs.duration }}
          CUSTOM_SECONDS: ${{ inputs.custom_seconds }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          supplied=os.environ['DRIVE_FILE_ID'].strip()
          if supplied.startswith('https://'):
              parsed=urllib.parse.urlparse(supplied)
              if parsed.hostname not in ('drive.google.com','www.drive.google.com'):
                  raise SystemExit('Expected a Google Drive share link')
              match=re.search(r'/file/d/([A-Za-z0-9_-]+)',parsed.path)
              supplied=match.group(1) if match else urllib.parse.parse_qs(parsed.query).get('id',[''])[0]
          if not re.fullmatch(r'[A-Za-z0-9_-]{15,}',supplied):
              raise SystemExit('Invalid Google Drive file ID or share link')
          os.environ['DRIVE_ID']=supplied
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'DRIVE_ID={supplied}\n')
          duration=os.environ['DURATION']
          if duration == 'auto':
              seconds=15
          elif duration == 'custom':
              seconds=int(os.environ['CUSTOM_SECONDS'])
          else:
              seconds=int(duration)
          if not 3 <= seconds <= 90:
              raise SystemExit('Duration must be between 3 and 90 seconds')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'REEL_SECONDS={seconds}\n')
          PY
          python3 - <<'PY'
          import os, gdown
          file_id=os.environ['DRIVE_FILE_ID'].strip()
          if file_id.startswith('https://'):
              import re, urllib.parse
              parsed=urllib.parse.urlparse(file_id)
              match=re.search(r'/file/d/([A-Za-z0-9_-]+)',parsed.path)
              file_id=match.group(1) if match else urllib.parse.parse_qs(parsed.query).get('id',[''])[0]
          result=gdown.download(id=file_id,output='artwork.img',quiet=False,fuzzy=True)
          if not result:
              raise SystemExit('Drive download failed. Confirm file is shared as Anyone with the link (Viewer), downloading is allowed, and the file ID is correct.')
          if os.path.getsize(result)>15_000_000:
              raise SystemExit('Image exceeds 15 MB limit.')
          PY
          python3 - <<'PY'
          import subprocess
          p=subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=p=0','artwork.img'],capture_output=True,text=True)
          if p.returncode or not p.stdout.strip():
              raise SystemExit('Google Drive did not return a valid image. Check file sharing (Anyone with link / Viewer), file size, and download restrictions.')
          print('Image dimensions:',p.stdout.strip())
          PY
      - name: Generate vertical MP4
        run: |
          ffmpeg -hide_banner -loglevel error -loop 1 -framerate 30 -i artwork.img \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -t "$REEL_SECONDS" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0x111827,format=yuv420p" \
            -c:v libx264 -preset veryfast -r 30 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -shortest -movflags +faststart reel.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 reel.mp4
      - name: Save video for review (no Facebook publishing)
        uses: actions/upload-artifact@v4
        with:
          name: ep-news-reel-preview
          path: reel.mp4
          retention-days: 7
