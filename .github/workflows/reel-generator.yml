name: EP News Reel Generator
on:
  push:
    branches: [main]
    paths:
      - 'reel-packages/*.json'
      - 'publication-manifests/*.json'
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Optional approved reel-packages/*.json path; overrides manual story fields'
        required: false
        type: string
      drive_file_id:
        description: 'Google Drive file ID or share link for approved EP News graphic'
        required: false
        type: string
      reel_title:
        description: 'Approved factual headline'
        required: false
        type: string
      reel_description:
        description: 'Approved short news article (~100 words, 3-5 hashtags)'
        required: false
        type: string
      music_category:
        description: 'Music category: requires licensed audio unless none'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'breaking-news'
          - 'war-military'
          - 'concerning'
          - 'texas-south'
      music_track:
        description: 'Optional exact licensed track from catalog'
        required: false
        type: string
      publish_mode:
        description: 'Preview locally, or upload unpublished Meta draft'
        required: true
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'draft'
      duration:
        description: 'Reel length in seconds, or auto'
        required: true
        default: '15'
        type: choice
        options:
          - '10'
          - '15'
          - '30'
          - '60'
          - 'auto'
          - 'custom'
      custom_seconds:
        description: 'Only used when duration is custom (3-90 seconds)'
        required: false
        default: '30'
        type: string
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve approved EP News package
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            export PACKAGE_PATH="$(python3 scripts/select_changed_reel_package.py)"
          fi
          python3 scripts/resolve_reel_package.py
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install Drive downloader
        run: python3 -m pip install --disable-pip-version-check gdown==5.2.0
      - name: Validate inputs and download approved artwork
        env:
          DRIVE_FILE_ID: ${{ env.DRIVE_FILE_ID || inputs.drive_file_id }}
          DURATION: ${{ env.DURATION || inputs.duration }}
          CUSTOM_SECONDS: ${{ env.CUSTOM_SECONDS || inputs.custom_seconds }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          supplied=os.environ['DRIVE_FILE_ID'].strip()
          if supplied.startswith('https://'):
              parsed=urllib.parse.urlparse(supplied)
              if parsed.hostname not in ('drive.google.com','www.drive.google.com'):
                  raise SystemExit('Expected a Google Drive share link')
              match=re.search(r'/file/d/([A-Za-z0-9_-]+)',parsed.path)
              supplied=match.group(1) if match else urllib.parse.parse_qs(parsed.query).get('id',[''])[0]
          if not re.fullmatch(r'[A-Za-z0-9_-]{15,}',supplied):
              raise SystemExit('Invalid Google Drive file ID or share link')
          os.environ['DRIVE_ID']=supplied
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'DRIVE_ID={supplied}\n')
          duration=os.environ['DURATION']
          if duration == 'auto':
              seconds=15
          elif duration == 'custom':
              seconds=int(os.environ['CUSTOM_SECONDS'])
          else:
              seconds=int(duration)
          if not 3 <= seconds <= 90:
              raise SystemExit('Duration must be between 3 and 90 seconds')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'REEL_SECONDS={seconds}\n')
          PY
          python3 - <<'PY'
          import os, gdown
          file_id=os.environ['DRIVE_FILE_ID'].strip()
          if file_id.startswith('https://'):
              import re, urllib.parse
              parsed=urllib.parse.urlparse(file_id)
              match=re.search(r'/file/d/([A-Za-z0-9_-]+)',parsed.path)
              file_id=match.group(1) if match else urllib.parse.parse_qs(parsed.query).get('id',[''])[0]
          result=gdown.download(id=file_id,output='artwork.img',quiet=False,fuzzy=True)
          if not result:
              raise SystemExit('Drive download failed. Confirm file is shared as Anyone with the link (Viewer), downloading is allowed, and the file ID is correct.')
          if os.path.getsize(result)>15_000_000:
              raise SystemExit('Image exceeds 15 MB limit.')
          PY
          python3 - <<'PY'
          import subprocess
          p=subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=p=0','artwork.img'],capture_output=True,text=True)
          if p.returncode or not p.stdout.strip():
              raise SystemExit('Google Drive did not return a valid image. Check file sharing (Anyone with link / Viewer), file size, and download restrictions.')
          print('Image dimensions:',p.stdout.strip())
          PY
      - name: Resolve and validate licensed soundtrack
        env:
          MUSIC_CATEGORY: ${{ env.MUSIC_CATEGORY || inputs.music_category }}
          MUSIC_TRACK: ${{ env.MUSIC_TRACK || inputs.music_track }}
        run: python3 scripts/resolve_reel_audio.py
      - name: Generate vertical MP4 with approved audio
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REEL_MUSIC_MODE" = "track" ]; then
            ffmpeg -hide_banner -loglevel error -loop 1 -framerate 30 -i artwork.img -stream_loop -1 -i "$REEL_AUDIO_PATH" \
              -t "$REEL_SECONDS" -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0x111827,format=yuv420p" \
              -af "afade=t=out:st=$((REEL_SECONDS-1)):d=1,aresample=48000" \
              -c:v libx264 -preset veryfast -r 30 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart reel.mp4
            python3 scripts/check_reel_audio.py reel.mp4
          elif [ "$REEL_MUSIC_MODE" = "none" ]; then
            ffmpeg -hide_banner -loglevel error -loop 1 -framerate 30 -i artwork.img \
              -t "$REEL_SECONDS" -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0x111827,format=yuv420p" \
              -c:v libx264 -preset veryfast -r 30 -pix_fmt yuv420p -an -movflags +faststart reel.mp4
          else
            echo 'Unrecognized music selection state' >&2; exit 1
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 reel.mp4
      - name: Validate duration for Meta Reels
        run: |
          if [ "$REEL_SECONDS" -lt 4 ] || [ "$REEL_SECONDS" -gt 60 ]; then
            echo "For Meta Reels use a duration of 4-60 seconds." >&2
            exit 1
          fi
      - name: Attach news article and optionally submit unpublished Meta draft
        env:
          REEL_TITLE: ${{ env.REEL_TITLE || inputs.reel_title }}
          REEL_DESCRIPTION: ${{ env.REEL_DESCRIPTION || inputs.reel_description }}
          REEL_MODE: ${{ inputs.publish_mode || 'preview' }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python3 scripts/meta_reel_upload.py
      - name: Save video for review (no Facebook publishing)
        uses: actions/upload-artifact@v4
        with:
          name: ep-news-reel-preview
          path: |
            reel.mp4
            reel-description.txt
            reel-meta-result.json
            reel-music-selection.json
          if-no-files-found: warn
          retention-days: 7
