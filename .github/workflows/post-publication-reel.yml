name: EP News post-publication Reel handoff
on:
  push:
    branches: [main]
    paths:
      - 'editorial-reel-inputs/*.json'
  workflow_dispatch:
    inputs:
      slug:
        description: Approved published article slug for recovery
        required: true
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: ep-news-reel-handoff
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select one approved editorial story
        id: select
        shell: bash
        env:
          MANUAL_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$MANUAL_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
            path="editorial-reel-inputs/$MANUAL_SLUG.json"
            test -f "$path"
            echo "path=$path" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t paths < <(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'editorial-reel-inputs/*.json')
          if [ "${#paths[@]}" -ne 1 ]; then
            echo "Exactly one newly added editorial input required; got ${#paths[@]}"
            exit 1
          fi
          echo "path=${paths[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify deployed article before creating manifest
        run: python3 scripts/verify_live_reel_story.py "${{ steps.select.outputs.path }}"
      - name: Check for existing handoff
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          STORY_PATH: ${{ steps.select.outputs.path }}
        run: |
          set -euo pipefail
          slug=$(python3 -c 'import json,os;print(json.load(open(os.environ["STORY_PATH"]))["slug"])')
          existing=$(gh pr list --state all --limit 100 --search "Reel preview handoff: $slug in:title" --json title,number --jq '.[] | select(.title == "Reel preview handoff: '+"$slug"+'") | .number')
          if [[ -f "publication-manifests/$slug.json" || -n "$existing" ]]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; fi
      - name: Prepare approved Reel manifest
        if: steps.duplicate.outputs.skip != 'true'
        run: python3 scripts/prepare_publication_reel.py verified-reel-story.json --approve-reel
      - name: Finalize remote candidate for authenticated connector
        if: steps.duplicate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STORY_PATH: ${{ steps.select.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(python3 -c 'import json,os;print(json.load(open(os.environ["STORY_PATH"]))["slug"])')"
          manifest="publication-manifests/$slug.json"
          branch="automation/reel-$slug-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git show "FETCH_HEAD:$manifest" | cmp - "$manifest"
            sha="$(git rev-parse FETCH_HEAD)"
          else
            git checkout -b "$branch"
            git add "$manifest"
            git commit -m "Prepare approved Reel manifest for $slug"
            git push origin "$branch"
            sha="$(git rev-parse HEAD)"
          fi
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          python3 -c 'import json,sys; print(json.dumps(dict(slug=sys.argv[1],branch=sys.argv[2],sha=sys.argv[3],manifest=sys.argv[4],source_sha=sys.argv[5],run_id=sys.argv[6])))' "$slug" "$branch" "$sha" "$manifest" "$GITHUB_SHA" "$GITHUB_RUN_ID" > reel-handoff.json
          cat reel-handoff.json
      - uses: actions/upload-artifact@v4
        if: steps.duplicate.outputs.skip != 'true'
        with:
          name: reel-connector-handoff
          path: reel-handoff.json
          retention-days: 30
