name: Targeted production browser recheck
on:
  pull_request:
    paths:
      - scripts/verify-publication-browser.mjs
      - .github/workflows/publication-browser-recheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-publication-browser.mjs us-venezuela-military-partnership-20261119 china-bars-bloomberg-reporter-20261119 two-summits-five-powers-20261119
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-publication-visual
          path: publication-visual/
