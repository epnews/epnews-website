name: Gate LNG offline research regression checks
on:
  pull_request:
    paths:
      - 'scripts/*gate*20261102.py'
      - 'scripts/*europe_lng*20261102.py'
      - '.github/workflows/gate-operator-baseline-integrated.yml'
      - '.github/workflows/gate-offline-pr-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-offline-tests:
    name: Gate LNG offline regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Gate LNG audit and source-acquisition tests
        run: |
          python scripts/test_europe_lng_gate_alsi_20261102.py
          python scripts/test_gate_gaspeil_snapshot_20261102.py
          python scripts/test_gate_integrated_evidence_audit_20261102.py
          python scripts/test_audit_gate_inventory_deltas_20261102.py
          python scripts/test_audit_gate_gaspeil_indicative_value_20261102.py
          python scripts/test_audit_gate_arrival_collision_exposure_20261102.py
          python scripts/test_audit_gate_origin_evidence_basis_20261102.py
          python scripts/test_audit_gate_gasday_utc_offsets_20261102.py
          python scripts/test_audit_gate_estimate_stock_variance_20261102.py
          python scripts/test_audit_gate_proxy_variance_cancellation_20261102.py
          python scripts/test_run_gate_snapshot_evidence_diagnostics_20261102.py
          python scripts/test_audit_gate_ttf_proxy_value_sensitivity_20261102.py
          python scripts/test_audit_gate_unmeasured_exposure_20261102.py
          python scripts/test_audit_gate_gasday_attribution_concentration_20261102.py
          python scripts/test_audit_gate_gasday_offset_hour_patterns_20261102.py
          python scripts/test_check_gate_cross_diagnostic_consistency_20261102.py
          python scripts/test_audit_gate_measured_operator_quality_segments_20261102.py
          python scripts/test_audit_gate_vessel_claim_evidence_gates_20261102.py
          python scripts/test_audit_gate_source_independence_20261102.py
          python scripts/test_audit_gate_attribution_stock_delta_eligibility_20261102.py
      - name: Validate integrated workflow Bash continuation syntax
        run: |
          python scripts/test_gate_integrated_workflow_shell_20261102.py
