name: Cheniere H1 Financial Baseline Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/cheniere-h1-2025-2026-financial-baseline.json'
      - 'scripts/audit_cheniere_financial_baseline.py'
      - 'scripts/test_audit_cheniere_financial_baseline.py'
      - '.github/workflows/cheniere-financial-baseline.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest scripts.test_audit_cheniere_financial_baseline
      - run: python scripts/audit_cheniere_financial_baseline.py data/cheniere-h1-2025-2026-financial-baseline.json cheniere-h1-financial-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: cheniere-h1-financial-audit
          path: cheniere-h1-financial-audit.json
          retention-days: 30
